controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true

    diff_cont: 
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters: 
    cmd_vel_timeout: 0.5
    publish_rate: 30.0
    base_frame_id: base_link
    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.24
    wheel_radius: 0.036
    use_stamped_vel: false

create2_system:
  ros__parameters:
    hardware_plugin: "create2_hardware/Create2System"
    port: "/dev/ttyUSB0"
    baud: "115200"
    wheel_separation: 0.24
    wheel_radius: 0.036
